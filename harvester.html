<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BHW Method Harvester</title>
<style>
  :root {
    --bg:       #0a0e14;
    --panel:    #0f141b;
    --panel-2:  #131a23;
    --border:   #1e2733;
    --border-2: #2a3648;
    --text:     #e6edf3;
    --muted:    #6b7a8f;
    --accent:   #00ff9d;
    --accent-2: #00cc7d;
    --warn:     #ffb454;
    --danger:   #ff5c5c;
    --mono:     'JetBrains Mono', 'Fira Code', 'Cascadia Code', Consolas, 'Courier New', monospace;
    --sans:     -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--sans);
    font-size: 14px;
    line-height: 1.55;
    overflow: hidden;
  }
  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-track { background: var(--bg); }
  ::-webkit-scrollbar-thumb { background: var(--border-2); border-radius: 5px; }
  ::-webkit-scrollbar-thumb:hover { background: var(--muted); }

  header {
    display: flex; align-items: center; justify-content: space-between;
    gap: 24px; padding: 14px 22px;
    background: var(--panel);
    border-bottom: 1px solid var(--border);
    position: relative; z-index: 10;
  }
  .brand { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
  .brand h1 {
    font-family: var(--mono);
    font-size: 15px; font-weight: 600;
    color: var(--text);
    letter-spacing: 0.02em;
    white-space: nowrap;
  }
  .brand h1 .prompt { color: var(--accent); margin-right: 6px; }
  .brand .subtitle {
    font-family: var(--mono);
    font-size: 10.5px;
    color: var(--muted);
    letter-spacing: 0.08em;
    text-transform: uppercase;
  }
  .stats {
    display: flex; gap: 20px; align-items: center;
    font-family: var(--mono);
    flex-wrap: wrap;
  }
  .stat { display: flex; flex-direction: column; align-items: flex-end; line-height: 1.15; }
  .stat .val { color: var(--accent); font-size: 15px; font-weight: 600; }
  .stat .lbl { color: var(--muted); font-size: 10px; letter-spacing: 0.08em; text-transform: uppercase; }
  .actions { display: flex; gap: 8px; align-items: center; }
  .icon-btn {
    background: var(--panel-2); border: 1px solid var(--border);
    color: var(--muted); padding: 7px 11px; border-radius: 6px;
    font-family: var(--mono); font-size: 12px; cursor: pointer;
    transition: all 0.15s;
    display: inline-flex; align-items: center; gap: 6px;
  }
  .icon-btn:hover { color: var(--accent); border-color: var(--accent-2); }
  .icon-btn.spinning svg { animation: spin 0.8s linear infinite; }
  @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }

  .layout {
    display: grid;
    grid-template-columns: 260px 1fr;
    height: calc(100vh - 63px);
  }

  aside {
    background: var(--panel);
    border-right: 1px solid var(--border);
    padding: 16px 12px;
    display: flex; flex-direction: column;
    gap: 14px;
    overflow-y: auto;
  }
  .search-wrap { position: relative; }
  .search-wrap input {
    width: 100%;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 8px 30px 8px 32px;
    color: var(--text);
    font-family: var(--mono);
    font-size: 12px;
    transition: border-color 0.15s;
  }
  .search-wrap input:focus {
    outline: none;
    border-color: var(--accent-2);
    box-shadow: 0 0 0 3px rgba(0,255,157,0.08);
  }
  .search-wrap::before {
    content: '>';
    position: absolute;
    left: 12px; top: 50%; transform: translateY(-50%);
    color: var(--accent); font-family: var(--mono); font-size: 12px;
    pointer-events: none;
  }
  .search-wrap .hint {
    position: absolute; right: 10px; top: 50%; transform: translateY(-50%);
    color: var(--muted); font-family: var(--mono); font-size: 10px;
    border: 1px solid var(--border); padding: 1px 5px; border-radius: 3px;
    pointer-events: none;
  }
  .sidebar-label {
    font-family: var(--mono); font-size: 10px;
    color: var(--muted); letter-spacing: 0.1em; text-transform: uppercase;
    padding: 0 6px;
  }
  .cat-list { display: flex; flex-direction: column; gap: 2px; }
  .cat-btn {
    display: flex; justify-content: space-between; align-items: center;
    gap: 8px;
    width: 100%;
    padding: 7px 10px;
    background: transparent;
    border: 1px solid transparent;
    border-radius: 5px;
    color: var(--text);
    font-family: var(--sans);
    font-size: 12.5px;
    text-align: left;
    cursor: pointer;
    transition: all 0.12s;
    overflow: hidden;
  }
  .cat-btn:hover { background: var(--panel-2); }
  .cat-btn.active {
    background: var(--panel-2);
    border-color: var(--border-2);
    color: var(--accent);
  }
  .cat-btn.active .cat-name { color: var(--accent); }
  .cat-name {
    flex: 1;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    color: var(--text);
  }
  .cat-count {
    font-family: var(--mono); font-size: 10.5px;
    color: var(--muted);
    background: var(--bg);
    border: 1px solid var(--border);
    padding: 1px 7px;
    border-radius: 10px;
    flex-shrink: 0;
  }
  .cat-btn.active .cat-count {
    color: var(--accent);
    border-color: var(--accent-2);
  }

  main {
    overflow-y: auto;
    padding: 20px 24px 40px;
  }
  .toolbar {
    display: flex; justify-content: space-between; align-items: center;
    margin-bottom: 18px;
    gap: 12px;
  }
  .result-count {
    font-family: var(--mono); font-size: 12px;
    color: var(--muted);
  }
  .result-count strong { color: var(--accent); font-weight: 600; }
  .sort-select {
    background: var(--panel-2);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 6px 10px;
    border-radius: 5px;
    font-family: var(--mono);
    font-size: 11.5px;
    cursor: pointer;
  }
  .sort-select:focus { outline: none; border-color: var(--accent-2); }

  .method-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
    gap: 12px;
  }
  .method-card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 14px 16px;
    cursor: pointer;
    transition: all 0.15s;
    position: relative;
    display: flex;
    flex-direction: column;
    gap: 8px;
    overflow: hidden;
  }
  .method-card::before {
    content: '';
    position: absolute;
    left: 0; top: 0; bottom: 0;
    width: 2px;
    background: var(--accent);
    opacity: 0;
    transition: opacity 0.15s;
  }
  .method-card:hover {
    border-color: var(--border-2);
    transform: translateY(-1px);
    background: var(--panel-2);
  }
  .method-card:hover::before { opacity: 1; }
  .method-cat {
    font-family: var(--mono);
    font-size: 10px;
    color: var(--warn);
    letter-spacing: 0.06em;
    text-transform: uppercase;
  }
  .method-title {
    font-size: 14.5px;
    font-weight: 600;
    color: var(--text);
    line-height: 1.35;
    overflow: hidden;
    text-overflow: ellipsis;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
  }
  .method-explain {
    color: var(--muted);
    font-size: 12.5px;
    line-height: 1.5;
    overflow: hidden;
    text-overflow: ellipsis;
    display: -webkit-box;
    -webkit-line-clamp: 3;
    -webkit-box-orient: vertical;
    flex: 1;
  }
  .method-footer {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-top: 4px;
    padding-top: 8px;
    border-top: 1px solid var(--border);
  }
  .ref-badge {
    font-family: var(--mono);
    font-size: 10.5px;
    color: var(--muted);
    display: inline-flex;
    align-items: center;
    gap: 4px;
  }
  .ref-badge.has-refs { color: var(--accent); }
  .ref-badge svg { width: 11px; height: 11px; }

  .empty-state {
    text-align: center;
    padding: 80px 20px;
    color: var(--muted);
    grid-column: 1 / -1;
  }
  .empty-state .icon {
    font-size: 36px;
    margin-bottom: 12px;
    color: var(--border-2);
  }
  .empty-state h2 {
    font-family: var(--mono);
    font-size: 14px;
    color: var(--text);
    margin-bottom: 6px;
    letter-spacing: 0.04em;
  }
  .empty-state p {
    font-size: 12.5px;
    max-width: 480px;
    margin: 0 auto;
    line-height: 1.6;
  }
  .empty-state code {
    font-family: var(--mono);
    color: var(--accent);
    background: var(--panel);
    padding: 2px 6px;
    border-radius: 3px;
    border: 1px solid var(--border);
  }
  .empty-state button {
    margin-top: 18px;
    background: var(--panel-2);
    border: 1px solid var(--border-2);
    color: var(--accent);
    padding: 9px 16px;
    border-radius: 6px;
    font-family: var(--mono);
    font-size: 12px;
    cursor: pointer;
    transition: all 0.15s;
  }
  .empty-state button:hover { border-color: var(--accent); }

  .modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.7);
    backdrop-filter: blur(4px);
    -webkit-backdrop-filter: blur(4px);
    z-index: 100;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.18s;
  }
  .modal-overlay.open { opacity: 1; pointer-events: auto; }
  .modal {
    background: var(--panel);
    border: 1px solid var(--border-2);
    border-radius: 10px;
    width: 100%;
    max-width: 780px;
    max-height: 88vh;
    overflow-y: auto;
    padding: 24px 28px;
    transform: scale(0.98);
    transition: transform 0.18s;
    box-shadow: 0 20px 60px rgba(0,0,0,0.6);
  }
  .modal-overlay.open .modal { transform: scale(1); }
  .modal-header {
    display: flex; justify-content: space-between; align-items: flex-start;
    gap: 16px;
    margin-bottom: 16px;
  }
  .modal-cat {
    font-family: var(--mono);
    font-size: 10.5px;
    color: var(--warn);
    letter-spacing: 0.08em;
    text-transform: uppercase;
    margin-bottom: 4px;
  }
  .modal-title {
    font-size: 20px;
    font-weight: 600;
    line-height: 1.35;
    color: var(--text);
  }
  .modal-close {
    background: transparent;
    border: 1px solid var(--border);
    color: var(--muted);
    width: 30px; height: 30px;
    border-radius: 6px;
    cursor: pointer;
    font-size: 18px;
    line-height: 1;
    flex-shrink: 0;
    transition: all 0.15s;
  }
  .modal-close:hover { color: var(--danger); border-color: var(--danger); }
  .modal-section {
    margin-top: 18px;
    padding-top: 18px;
    border-top: 1px solid var(--border);
  }
  .modal-section-label {
    font-family: var(--mono);
    font-size: 10px;
    color: var(--muted);
    letter-spacing: 0.1em;
    text-transform: uppercase;
    margin-bottom: 8px;
  }
  .modal-explanation {
    color: var(--text);
    font-size: 13.5px;
    line-height: 1.7;
    white-space: pre-wrap;
  }
  .link-row {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 9px 12px;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 5px;
    margin-bottom: 6px;
    font-family: var(--mono);
    font-size: 11.5px;
    transition: border-color 0.15s;
  }
  .link-row:hover { border-color: var(--accent-2); }
  .link-row a {
    color: var(--accent);
    text-decoration: none;
    flex: 1;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .link-row a:hover { text-decoration: underline; }
  .link-row .copy-btn {
    background: transparent;
    border: 1px solid var(--border);
    color: var(--muted);
    padding: 3px 8px;
    border-radius: 4px;
    font-family: var(--mono);
    font-size: 10px;
    cursor: pointer;
    flex-shrink: 0;
    transition: all 0.15s;
  }
  .link-row .copy-btn:hover { color: var(--accent); border-color: var(--accent-2); }
  .link-row .copy-btn.copied { color: var(--accent); border-color: var(--accent-2); }
  .no-refs {
    color: var(--muted);
    font-size: 12px;
    font-style: italic;
    font-family: var(--mono);
  }

  @media (max-width: 860px) {
    .layout { grid-template-columns: 1fr; grid-template-rows: auto 1fr; }
    aside { border-right: none; border-bottom: 1px solid var(--border); max-height: 180px; }
    .stats { display: none; }
  }
</style>
</head>
<body>

<header>
  <div class="brand">
    <h1><span class="prompt">$</span>BHW METHOD HARVESTER</h1>
    <div class="subtitle">blackhatworld &middot; method intelligence dashboard</div>
  </div>
  <div class="stats">
    <div class="stat"><span class="val" id="stat-total">—</span><span class="lbl">methods</span></div>
    <div class="stat"><span class="val" id="stat-cats">—</span><span class="lbl">categories</span></div>
    <div class="stat"><span class="val" id="stat-primaries">—</span><span class="lbl">primaries</span></div>
    <div class="stat"><span class="val" id="stat-refs">—</span><span class="lbl">references</span></div>
  </div>
  <div class="actions">
    <button class="icon-btn" id="refresh-btn" title="Reload data from disk">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="23 4 23 10 17 10"></polyline>
        <polyline points="1 20 1 14 7 14"></polyline>
        <path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"></path>
      </svg>
      refresh
    </button>
  </div>
</header>

<div class="layout">
  <aside>
    <div class="search-wrap">
      <input type="text" id="search" placeholder="search methods" autocomplete="off" spellcheck="false">
      <span class="hint">/</span>
    </div>
    <div class="sidebar-label">categories</div>
    <div class="cat-list" id="cat-list"></div>
  </aside>

  <main>
    <div class="toolbar">
      <div class="result-count" id="result-count">loading...</div>
      <select class="sort-select" id="sort">
        <option value="alpha">sort: A → Z</option>
        <option value="alpha-desc">sort: Z → A</option>
        <option value="refs">sort: references</option>
      </select>
    </div>
    <div class="method-grid" id="method-grid"></div>
  </main>
</div>

<input type="file" id="file-input" accept=".json,application/json" style="display:none">

<div class="modal-overlay" id="modal-overlay">
  <div class="modal" id="modal">
    <div class="modal-header">
      <div>
        <div class="modal-cat" id="modal-cat"></div>
        <div class="modal-title" id="modal-title"></div>
      </div>
      <button class="modal-close" id="modal-close" title="Close (Esc)">&times;</button>
    </div>
    <div class="modal-section">
      <div class="modal-section-label">explanation</div>
      <div class="modal-explanation" id="modal-explanation"></div>
    </div>
    <div class="modal-section">
      <div class="modal-section-label">primary source</div>
      <div id="modal-primary"></div>
    </div>
    <div class="modal-section">
      <div class="modal-section-label">references</div>
      <div id="modal-refs"></div>
    </div>
  </div>
</div>

<script>
(() => {
  'use strict';

  const DB_FILE = 'knowledge_base.json';

  const state = {
    data: {},
    flat: [],
    filtered: [],
    category: null,
    query: '',
    sort: 'alpha',
    stats: null,
    fingerprint: '',
  };

  const $ = id => document.getElementById(id);
  const esc = s => String(s ?? '').replace(/[&<>"']/g, c => (
    { '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]
  ));

  function computeStats(data) {
    const per_cat = {};
    let total = 0, refs = 0;
    const primary = new Set();
    for (const [cat, list] of Object.entries(data)) {
      if (!Array.isArray(list)) continue;
      per_cat[cat] = list.length;
      total += list.length;
      for (const m of list) {
        if (!m || typeof m !== 'object') continue;
        if (m.primary_link) primary.add(m.primary_link);
        refs += (m.references || []).length;
      }
    }
    return {
      total_methods:    total,
      categories:       Object.keys(per_cat).length,
      unique_primaries: primary.size,
      total_references: refs,
      per_category:     per_cat,
    };
  }

  function flatten(data) {
    const out = [];
    for (const [cat, list] of Object.entries(data)) {
      if (!Array.isArray(list)) continue;
      for (const m of list) {
        if (m && typeof m === 'object') {
          out.push({ ...m, category: cat });
        }
      }
    }
    return out;
  }

  function applyFilters() {
    let list = state.flat.slice();
    if (state.category) list = list.filter(m => m.category === state.category);
    if (state.query) {
      const q = state.query.toLowerCase();
      list = list.filter(m =>
        (m.method_title || '').toLowerCase().includes(q) ||
        (m.explanation  || '').toLowerCase().includes(q) ||
        (m.category     || '').toLowerCase().includes(q)
      );
    }
    switch (state.sort) {
      case 'refs':
        list.sort((a, b) => (b.references || []).length - (a.references || []).length);
        break;
      case 'alpha-desc':
        list.sort((a, b) => (b.method_title || '').localeCompare(a.method_title || ''));
        break;
      default:
        list.sort((a, b) => (a.method_title || '').localeCompare(b.method_title || ''));
    }
    state.filtered = list;
    renderMethods();
    renderResultCount();
  }

  function renderStats(stats) {
    $('stat-total').textContent     = stats.total_methods;
    $('stat-cats').textContent      = stats.categories;
    $('stat-primaries').textContent = stats.unique_primaries;
    $('stat-refs').textContent      = stats.total_references;
  }

  function renderSidebar(stats) {
    const list = $('cat-list');
    const active = state.category;
    list.innerHTML = '';

    const mkBtn = (label, count, isActive, onClick) => {
      const btn = document.createElement('button');
      btn.className = 'cat-btn' + (isActive ? ' active' : '');
      btn.innerHTML = `<span class="cat-name">${esc(label)}</span><span class="cat-count">${count}</span>`;
      btn.addEventListener('click', onClick);
      return btn;
    };

    list.appendChild(mkBtn('all methods', stats.total_methods, active === null, () => {
      state.category = null;
      renderSidebar(stats);
      applyFilters();
    }));

    const cats = Object.keys(stats.per_category).sort((a, b) => a.localeCompare(b));
    for (const cat of cats) {
      list.appendChild(mkBtn(cat, stats.per_category[cat], active === cat, () => {
        state.category = cat;
        renderSidebar(stats);
        applyFilters();
      }));
    }
  }

  function renderResultCount() {
    const n = state.filtered.length;
    const total = state.flat.length;
    const parts = [];
    if (state.category) parts.push(`<strong>${esc(state.category)}</strong>`);
    if (state.query) parts.push(`matching "<strong>${esc(state.query)}</strong>"`);
    const ctx = parts.length ? ' &middot; ' + parts.join(' ') : '';
    $('result-count').innerHTML = `<strong>${n}</strong> of ${total} methods${ctx}`;
  }

  function renderMethods() {
    const grid = $('method-grid');
    grid.innerHTML = '';

    if (state.flat.length === 0) {
      grid.innerHTML = `
        <div class="empty-state">
          <div class="icon">▤</div>
          <h2>NO DATA LOADED</h2>
          <p>Could not fetch <code>${esc(DB_FILE)}</code> automatically. If you're
             opening this file directly (<code>file://</code>), browsers block
             local fetches &mdash; either serve the folder over HTTP
             (<code>python -m http.server</code>) or load the file manually.</p>
          <button id="load-file-btn">choose ${esc(DB_FILE)}</button>
        </div>`;
      const btn = $('load-file-btn');
      if (btn) btn.addEventListener('click', () => $('file-input').click());
      return;
    }
    if (state.filtered.length === 0) {
      grid.innerHTML = `
        <div class="empty-state">
          <div class="icon">⌕</div>
          <h2>NO MATCHES</h2>
          <p>Try a different search term or clear the category filter.</p>
        </div>`;
      return;
    }

    const frag = document.createDocumentFragment();
    for (const m of state.filtered) {
      const card = document.createElement('div');
      card.className = 'method-card';
      const refCount = (m.references || []).length;
      card.innerHTML = `
        <div class="method-cat">${esc(m.category || 'uncategorized')}</div>
        <div class="method-title">${esc(m.method_title || '(untitled)')}</div>
        <div class="method-explain">${esc(m.explanation || '')}</div>
        <div class="method-footer">
          <span class="ref-badge${refCount > 0 ? ' has-refs' : ''}">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"></path>
              <path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"></path>
            </svg>
            ${refCount} reference${refCount === 1 ? '' : 's'}
          </span>
          <span class="ref-badge">click to open →</span>
        </div>`;
      card.addEventListener('click', () => openModal(m));
      frag.appendChild(card);
    }
    grid.appendChild(frag);
  }

  function makeLinkRow(url) {
    const row = document.createElement('div');
    row.className = 'link-row';
    row.innerHTML = `
      <a href="${esc(url)}" target="_blank" rel="noopener noreferrer">${esc(url)}</a>
      <button class="copy-btn" type="button">copy</button>`;
    row.querySelector('.copy-btn').addEventListener('click', async (e) => {
      e.stopPropagation();
      const btn = e.currentTarget;
      try {
        await navigator.clipboard.writeText(url);
        btn.textContent = 'copied';
        btn.classList.add('copied');
        setTimeout(() => { btn.textContent = 'copy'; btn.classList.remove('copied'); }, 1400);
      } catch {
        btn.textContent = 'err';
        setTimeout(() => { btn.textContent = 'copy'; }, 1400);
      }
    });
    return row;
  }

  function openModal(m) {
    $('modal-cat').textContent         = m.category || 'uncategorized';
    $('modal-title').textContent       = m.method_title || '(untitled)';
    $('modal-explanation').textContent = m.explanation || 'No explanation available.';

    const primaryEl = $('modal-primary');
    primaryEl.innerHTML = '';
    if (m.primary_link) {
      primaryEl.appendChild(makeLinkRow(m.primary_link));
    } else {
      primaryEl.innerHTML = '<div class="no-refs">no primary link</div>';
    }

    const refsEl = $('modal-refs');
    refsEl.innerHTML = '';
    const refs = m.references || [];
    if (refs.length === 0) {
      refsEl.innerHTML = '<div class="no-refs">no additional references</div>';
    } else {
      for (const url of refs) refsEl.appendChild(makeLinkRow(url));
    }

    $('modal-overlay').classList.add('open');
    document.body.style.overflow = 'hidden';
  }

  function closeModal() {
    $('modal-overlay').classList.remove('open');
    document.body.style.overflow = '';
  }

  function ingest(data, sourceLabel) {
    state.data = data && typeof data === 'object' && !Array.isArray(data) ? data : {};
    state.flat = flatten(state.data);
    state.stats = computeStats(state.data);
    state.fingerprint = JSON.stringify(state.stats);
    renderStats(state.stats);
    renderSidebar(state.stats);
    applyFilters();
    if (sourceLabel) console.log(`[+] loaded ${sourceLabel}`);
  }

  async function loadFromFetch(showFeedback) {
    const btn = $('refresh-btn');
    if (showFeedback) btn.classList.add('spinning');
    try {
      const url = `${DB_FILE}?t=${Date.now()}`;
      const res = await fetch(url, { cache: 'no-store' });
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      const data = await res.json();
      ingest(data, DB_FILE);
    } catch (err) {
      console.warn('[!] fetch failed:', err.message);
      if (!state.stats || state.stats.total_methods === 0) {
        ingest({}, null);
      }
    } finally {
      if (showFeedback) setTimeout(() => btn.classList.remove('spinning'), 400);
    }
  }

  async function silentPoll() {
    try {
      const res = await fetch(`${DB_FILE}?t=${Date.now()}`, { cache: 'no-store' });
      if (!res.ok) return;
      const data = await res.json();
      const stats = computeStats(data);
      const fp = JSON.stringify(stats);
      if (fp !== state.fingerprint) {
        console.log('[*] data changed on disk — reloading');
        ingest(data, DB_FILE);
      }
    } catch { /* ignore */ }
  }

  $('file-input').addEventListener('change', async (e) => {
    const file = e.target.files?.[0];
    if (!file) return;
    try {
      const text = await file.text();
      const data = JSON.parse(text);
      ingest(data, file.name);
    } catch (err) {
      alert('Failed to parse JSON: ' + err.message);
    } finally {
      e.target.value = '';
    }
  });

  $('search').addEventListener('input', e => {
    state.query = e.target.value.trim();
    applyFilters();
  });

  $('sort').addEventListener('change', e => {
    state.sort = e.target.value;
    applyFilters();
  });

  $('refresh-btn').addEventListener('click', () => loadFromFetch(true));

  $('modal-close').addEventListener('click', closeModal);
  $('modal-overlay').addEventListener('click', e => {
    if (e.target === $('modal-overlay')) closeModal();
  });

  document.addEventListener('keydown', e => {
    if (e.key === 'Escape') {
      if ($('modal-overlay').classList.contains('open')) closeModal();
      else if (document.activeElement === $('search')) {
        $('search').value = '';
        state.query = '';
        applyFilters();
        $('search').blur();
      }
    }
    if (e.key === '/' && document.activeElement !== $('search')) {
      e.preventDefault();
      $('search').focus();
      $('search').select();
    }
  });

  loadFromFetch(false);
  setInterval(silentPoll, 10000);
})();
</script>
</body>
</html>
